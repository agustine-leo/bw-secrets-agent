# GoReleaser configuration — https://goreleaser.com
# Run locally: goreleaser release --snapshot --clean
# Release: push a v* tag; GitHub Actions invokes goreleaser via .github/workflows/release.yml.

version: 2

project_name: bw-secrets-agent

before:
  hooks:
    - go mod tidy

builds:
  - id: bw-secrets-agent
    main: ./cmd/bw-secrets-agent
    binary: bw-secrets-agent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: bw-secrets-agent
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE
      - CHANGELOG.md
      - config.d/example.hcl
      - templates/app.tpl

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: agustine-leo
    name: bw-secrets-agent
  draft: false
  prerelease: auto
  header: |
    ## bw-secrets-agent {{ .Tag }}

    Built from `{{ .ShortCommit }}` on {{ .Date }}.
  footer: |
    **Full changelog:** https://github.com/agustine-leo/bw-secrets-agent/compare/{{ .PreviousTag }}...{{ .Tag }}
